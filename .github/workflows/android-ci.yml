name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build debug APK
    runs-on: [self-hosted, Windows]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure local Android build environment
        shell: cmd
        run: |
          set "SDK_ROOT=%ANDROID_SDK_ROOT%"
          if not defined SDK_ROOT set "SDK_ROOT=%ANDROID_HOME%"
          if not defined SDK_ROOT if exist "%LOCALAPPDATA%\Android\Sdk" set "SDK_ROOT=%LOCALAPPDATA%\Android\Sdk"
          if not defined SDK_ROOT if exist "%USERPROFILE%\AppData\Local\Android\Sdk" set "SDK_ROOT=%USERPROFILE%\AppData\Local\Android\Sdk"
          if not defined SDK_ROOT (
            echo Android SDK was not found.
            exit /b 1
          )
          if not exist "%SDK_ROOT%" (
            echo Android SDK path does not exist: %SDK_ROOT%
            exit /b 1
          )
          set "ANDROID_HOME=%SDK_ROOT%"
          set "ANDROID_SDK_ROOT=%SDK_ROOT%"
          echo ANDROID_SDK_ROOT=%SDK_ROOT%
          if exist "%SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" (
            set "SDKMANAGER=%SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat"
          ) else if exist "%SDK_ROOT%\cmdline-tools\bin\sdkmanager.bat" (
            set "SDKMANAGER=%SDK_ROOT%\cmdline-tools\bin\sdkmanager.bat"
          ) else if exist "%SDK_ROOT%\tools\bin\sdkmanager.bat" (
            set "SDKMANAGER=%SDK_ROOT%\tools\bin\sdkmanager.bat"
          ) else (
            echo sdkmanager.bat was not found under %SDK_ROOT%.
            exit /b 1
          )
          echo SDKMANAGER=%SDKMANAGER%
          "%SDKMANAGER%" --version
          if errorlevel 1 exit /b 1
          echo sdk.dir=%SDK_ROOT%>local.properties

      - name: Install required Android components
        shell: cmd
        run: |
          set "SDK_ROOT=%ANDROID_SDK_ROOT%"
          if not defined SDK_ROOT set "SDK_ROOT=%ANDROID_HOME%"
          if not defined SDK_ROOT set "SDK_ROOT=%LOCALAPPDATA%\Android\Sdk"
          if exist "%SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" (
            set "SDKMANAGER=%SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat"
          ) else if exist "%SDK_ROOT%\cmdline-tools\bin\sdkmanager.bat" (
            set "SDKMANAGER=%SDK_ROOT%\cmdline-tools\bin\sdkmanager.bat"
          ) else if exist "%SDK_ROOT%\tools\bin\sdkmanager.bat" (
            set "SDKMANAGER=%SDK_ROOT%\tools\bin\sdkmanager.bat"
          ) else (
            echo sdkmanager.bat was not found under %SDK_ROOT%.
            exit /b 1
          )
          "%SDKMANAGER%" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
          if errorlevel 1 exit /b 1

      - name: Run unit tests and assemble debug APK
        shell: cmd
        run: gradlew.bat testDebugUnitTest assembleDebug --no-daemon --no-configuration-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
