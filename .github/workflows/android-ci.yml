name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build debug APK
    runs-on: [self-hosted, Windows]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android and Java environment
        shell: cmd
        run: |
          java -version
          if errorlevel 1 exit /b 1
          echo ANDROID_HOME=%ANDROID_HOME%
          if not defined ANDROID_HOME (
            echo ANDROID_HOME is not configured after Android SDK setup.
            exit /b 1
          )
          if exist "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" (
            set "SDKMANAGER=%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat"
          ) else if exist "%ANDROID_HOME%\cmdline-tools\bin\sdkmanager.bat" (
            set "SDKMANAGER=%ANDROID_HOME%\cmdline-tools\bin\sdkmanager.bat"
          ) else (
            echo sdkmanager.bat was not found under %ANDROID_HOME%.
            exit /b 1
          )
          "%SDKMANAGER%" --version
          if errorlevel 1 exit /b 1
          echo sdk.dir=%ANDROID_HOME%>local.properties

      - name: Install required Android components
        shell: cmd
        run: |
          set "SDKMANAGER=%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat"
          if not exist "%SDKMANAGER%" set "SDKMANAGER=%ANDROID_HOME%\cmdline-tools\bin\sdkmanager.bat"
          "%SDKMANAGER%" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
          if errorlevel 1 exit /b 1

      - name: Run unit tests and assemble debug APK
        shell: cmd
        run: gradlew.bat testDebugUnitTest assembleDebug --no-daemon --no-configuration-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
