name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build debug APK
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android components
        shell: pwsh
        run: |
          $yes = (1..100 | ForEach-Object { "y" }) -join "`n"
          $yes | & sdkmanager.bat --licenses
          & sdkmanager.bat "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APK
        run: .\\gradlew.bat testDebugUnitTest assembleDebug --no-daemon --no-configuration-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
