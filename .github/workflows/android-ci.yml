name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build debug APK
    runs-on: [self-hosted, Windows]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Bootstrap Android SDK
        shell: cmd
        run: |
          set "SDK_ROOT=%RUNNER_TEMP%\android-sdk"
          set "ZIP=%RUNNER_TEMP%\android-cmdline-tools.zip"
          set "EXTRACT=%RUNNER_TEMP%\android-cmdline-tools-extract"
          if exist "%SDK_ROOT%" rmdir /s /q "%SDK_ROOT%"
          if exist "%EXTRACT%" rmdir /s /q "%EXTRACT%"
          if exist "%ZIP%" del /f /q "%ZIP%"
          mkdir "%SDK_ROOT%"
          mkdir "%EXTRACT%"
          curl.exe -L --fail --retry 3 --retry-delay 5 -o "%ZIP%" "https://dl.google.com/android/repository/commandlinetools-win-12266719_latest.zip"
          if errorlevel 1 exit /b 1
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "Expand-Archive -LiteralPath '%ZIP%' -DestinationPath '%EXTRACT%' -Force"
          if errorlevel 1 exit /b 1
          if not exist "%EXTRACT%\cmdline-tools\bin\sdkmanager.bat" exit /b 1
          mkdir "%SDK_ROOT%\cmdline-tools"
          move "%EXTRACT%\cmdline-tools" "%SDK_ROOT%\cmdline-tools\latest"
          if errorlevel 1 exit /b 1
          >>"%GITHUB_ENV%" echo ANDROID_HOME=%SDK_ROOT%
          >>"%GITHUB_ENV%" echo ANDROID_SDK_ROOT=%SDK_ROOT%
          >>"%GITHUB_PATH%" echo %SDK_ROOT%\platform-tools
          >>"%GITHUB_PATH%" echo %SDK_ROOT%\cmdline-tools\latest\bin
          echo sdk.dir=%SDK_ROOT%>local.properties
          "%SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --version
          if errorlevel 1 exit /b 1

      - name: Verify Java and SDK manager
        shell: cmd
        run: |
          where java
          java -version
          if errorlevel 1 exit /b 1
          "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --version
          if errorlevel 1 exit /b 1

      - name: Accept Android SDK licenses
        shell: cmd
        run: |
          echo y|"%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --sdk_root="%ANDROID_SDK_ROOT%" --licenses
          if errorlevel 1 exit /b 1

      - name: Install platform-tools
        shell: cmd
        run: |
          "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --sdk_root="%ANDROID_SDK_ROOT%" "platform-tools"
          if errorlevel 1 exit /b 1

      - name: Install Android platform 36.1
        shell: cmd
        run: |
          "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --sdk_root="%ANDROID_SDK_ROOT%" "platforms;android-36.1"
          if errorlevel 1 exit /b 1

      - name: Install Android build tools 36.0.0
        shell: cmd
        run: |
          "%ANDROID_SDK_ROOT%\cmdline-tools\latest\bin\sdkmanager.bat" --sdk_root="%ANDROID_SDK_ROOT%" "build-tools;36.0.0"
          if errorlevel 1 exit /b 1

      - name: Verify Android SDK packages
        shell: cmd
        run: |
          if not exist "%ANDROID_SDK_ROOT%\platform-tools\adb.exe" exit /b 1
          if not exist "%ANDROID_SDK_ROOT%\platforms\android-36.1\android.jar" exit /b 1
          if not exist "%ANDROID_SDK_ROOT%\build-tools\36.0.0\aapt2.exe" exit /b 1

      - name: Run unit tests and assemble debug APK
        shell: cmd
        run: gradlew.bat testDebugUnitTest assembleDebug --no-daemon --no-configuration-cache -PPOWERHUB_API_BASE_URL=https://powerhub-platform.vercel.app/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
