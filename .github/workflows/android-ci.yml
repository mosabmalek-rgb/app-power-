name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build debug APK
    runs-on: [self-hosted, Windows]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify local Android build environment
        shell: cmd
        run: |
          where java
          java -version
          if errorlevel 1 exit /b 1
          where sdkmanager.bat
          if errorlevel 1 exit /b 1
          sdkmanager.bat --version
          if errorlevel 1 exit /b 1

      - name: Install required Android components
        shell: cmd
        run: |
          (for /L %%i in (1,1,100) do @echo y) | sdkmanager.bat --licenses
          if errorlevel 1 exit /b 1
          sdkmanager.bat "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"
          if errorlevel 1 exit /b 1

      - name: Run unit tests and assemble debug APK
        shell: cmd
        run: gradlew.bat testDebugUnitTest assembleDebug --no-daemon --no-configuration-cache
        working-directory: .

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
